# Compila Onyx Client (Windows, Linux y macOS) y lo publica en ESTE repo.
#
# El código está en el repo PRIVADO kewinnsinhoo/onyx-client: aquí solo se copia para compilar.
# Este repo es público (los minutos de GitHub Actions son gratis) y cualquiera puede leer sus
# registros, así que la salida de npm y de la compilación va a un archivo que nunca se sube.
# Si algo falla, solo se muestran las líneas de error.
#
# Secreto: SOURCE_TOKEN (token fine-grained con SOLO «Contents: read» de onyx-client).
# Publicar usa el GITHUB_TOKEN de este repo.
name: Onyx Client
run-name: Onyx Client ${{ inputs.ref }}${{ inputs.dry_run && ' (prueba)' || '' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o commit de onyx-client'
        default: 'main'
        required: true
      dry_run:
        description: 'Prueba: compila y no publica'
        type: boolean
        default: false
      brands:
        description: 'Al terminar, recompilar los launchers de marca'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: onyx-client
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PANEL: https://panel.onyxclient.site

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      tag: ${{ steps.src.outputs.tag }}
    steps:
      - name: Ejecuciones anteriores fuera
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --status completed --limit 100 --json databaseId -q '.[].databaseId' \
            | while read -r id; do gh run delete "$id" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true; done

      - name: Código
        id: src
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::ref no válido"; exit 1; }
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/kewinnsinhoo/onyx-client.git "$REF"
          git -C src checkout -q FETCH_HEAD
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(node -p "require('./src/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Borrador de la release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.src.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            echo "Ya hay un borrador de $TAG: se reutiliza."
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::La versión $TAG ya está publicada. Sube la versión en package.json."; exit 1
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Onyx Client $TAG" --notes "Versión $TAG de Onyx Client." > /dev/null
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Código
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/kewinnsinhoo/onyx-client.git "$SHA"
          git -C src checkout -q FETCH_HEAD
      - name: Dependencias y pruebas
        working-directory: src
        run: |
          LOG="$RUNNER_TEMP/build.log"
          { node scripts/prepare-ci.js && npm install --no-audit --no-fund && npm test; } > "$LOG" 2>&1 \
            || { echo "::error::Fallaron las dependencias o las pruebas"; grep -iE "error|✗|fail" "$LOG" | grep -v "node_modules" | tail -25; exit 1; }
      - name: Compilar y subir
        working-directory: src
        env:
          GH_TOKEN: ${{ !inputs.dry_run && github.token || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DRY: ${{ inputs.dry_run }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          PUB=always; [ "$DRY" = true ] && PUB=never
          ARGS=""; [ "$RUNNER_OS" = macOS ] && ARGS="--mac"
          npx electron-builder $ARGS --publish $PUB > "$LOG" 2>&1 \
            || { echo "::error::La compilación ha fallado"; grep -iE "error|cannot|failed" "$LOG" | tail -25; exit 1; }
          ls dist | grep -E '\.(exe|dmg|zip|AppImage|yml)$' || true

  publish:
    needs: [prepare, build]
    if: ${{ always() && !inputs.dry_run && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Publicar (si está el instalador de Windows)
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q '\.exe$' \
            || { echo "::error::No se generó el instalador de Windows: no se publica."; exit 1; }
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Recompilar los launchers de marca
        if: ${{ inputs.brands }}
        run: |
          curl -fsS "$PANEL/api/public/brands" | jq -r '.brands[].id' | while read -r id; do
            [[ "$id" =~ ^[a-z][a-z0-9-]{1,31}$ ]] || continue
            gh workflow run build-brand.yml -R "$GITHUB_REPOSITORY" -f brand="$id" -f ref="${{ needs.prepare.outputs.sha }}" && echo "Marca $id en cola"
            sleep 2
          done
